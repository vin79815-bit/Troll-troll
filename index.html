<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AB Banh Bank</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:#eceff3;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}
.phone{
width:360px;
background:white;
border-radius:25px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
overflow:hidden;
}
.top{
background:#d60000;
color:white;
padding:18px;
font-size:20px;
font-weight:bold;
text-align:center;
}
.content{
padding:20px;
text-align:center;
}
.loading{
font-size:18px;
margin:30px 0;
animation: blink 1s infinite;
}
@keyframes blink{
50%{opacity:0.3;}
}
.success{
display:none;
}
.notice{
background:#ffeaea;
padding:14px;
border-radius:14px;
color:#b30000;
font-weight:bold;
margin:15px 0;
}
.money{
font-size:22px;
font-weight:bold;
margin:15px 0;
}
button{
background:#d60000;
color:white;
border:none;
padding:12px 20px;
border-radius:12px;
font-size:16px;
cursor:pointer;
margin-top:10px;
}
.small{
font-size:12px;
color:#888;
margin-top:18px;
}
.shake{
animation:shake 0.3s;
}
@keyframes shake{
0%{transform:translateX(0);}
25%{transform:translateX(-8px);}
50%{transform:translateX(8px);}
75%{transform:translateX(-8px);}
100%{transform:translateX(0);}
}
</style>
</head>
<body>

<div class="phone" id="box">
<div class="top">🏦 AB Banh Bank</div>

<div class="content">

<div class="loading" id="load">
Đang xử lý giao dịch...
</div>

<div class="success" id="done">
<h2>✅ Thành công</h2>

<div class="notice">
Cảm ơn bạn đã cho Triệu Vĩ vay 2.000.000đ 😆
</div>

<div class="money">
Số dư còn lại: 999 tỷ tình bạn
</div>

<button onclick="alert('Triệu Vĩ nói: Khi nào giàu sẽ trả 😎')">
Đòi nợ ngay
</button>

<div class="small">
* Đây là web troll vui vẻ *
</div>
</div>

</div>
</div>

<script>
setTimeout(()=>{
document.getElementById("load").style.display="none";
document.getElementById("done").style.display="block";

document.getElementById("box").classList.add("shake");

if(navigator.vibrate){
navigator.vibrate([200,100,200]);
}
},2500);
</script>

</body>
</html>
